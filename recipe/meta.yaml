{% set name = "rl_games" %}
{% set version = "1.6.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Denys88/rl_games/archive/v{{ version }}.tar.gz
  sha256: dca1fe2e7333995a2b7f39d8966975795ab8bec8c9bad80edc0fa7eaaa1e2dfe
  patches:
    - 01-exclude_package_data.patch
    - 02-remove_watchdog_upper_bound.patch

build:
  noarch: python
  script:
    - rm poetry.lock pyproject.toml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - gym >=0.17.2
    - tensorboard >=1.14.0
    - tensorboardx >=1.6
    - pyyaml
    - psutil
    - setproctitle
    - opencv
    - wandb
    - pytorch
    - numpy
    - watchdog >=2.19

test:
  imports:
    - rl_games
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Denys88/rl_games
  summary: High performance RL library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - traversaro
    - flferretti
